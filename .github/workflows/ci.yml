name: WorldLoop CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pure-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Source-level and provenance tests
        run: python -m unittest discover -s tests -v
      - name: CPU paired benchmark smoke
        run: python worldloop.py --episodes 24 --seed 10000 --budget 4 --out /tmp/worldloop-smoke.json
