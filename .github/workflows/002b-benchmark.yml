name: 002B exploratory paired benchmark
on:
  push:
    paths:
      - ".github/workflows/002b-benchmark.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Train and test three seeds, unchanged world
        run: python learner002b.py --challenge a --train-episodes 2048 --epochs 25 --test-episodes 200 --budgets 4,8 --seeds 42,43,44 --out results/002b_a_explore.json
      - name: Train and test three seeds, world changes after baseline
        run: python learner002b.py --challenge b --train-episodes 2048 --epochs 25 --test-seed 410000 --test-episodes 200 --budgets 4,8 --seeds 42,43,44 --out results/002b_b_explore.json
      - name: Keep complete per-seed receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 002b-exploratory-receipts
          path: results/002b_*_explore.json
          if-no-files-found: warn
